<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trip Command Center</title>
    <meta name="description" content="Plan any trip like an operation: optimized routes, arrival times, weather for every stop, and a giant map. Free — no accounts, no API keys." />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#f5f5f7" />
    <script>
      // Set the appearance before first paint so there's no flash of the
      // wrong theme while React boots. Kept in sync with src/lib/theme.js.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('trip-command-center-v1'))
          var theme = (saved && saved.prefs && saved.prefs.theme) || 'light'
          var dark =
            theme === 'dark' ||
            (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = theme
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#000000' : '#f5f5f7')
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
